function mv(dx,dy){const x=p%N+dx,y=(p/N|0)+dy;if(x<0||y<0||x>=N||y>=N)return;const k=y*N+x;if(ob.has(k)){m++;no();say('الصخرة كبيرة! جرّب طريقاً آخر');return}p=k;tone(520,.06);if(sr.delete(k))ok();dr();if(k==fr){if(sr.size)say('لنجمع كل النجوم أولاً ⭐');else setTimeout(()=>done(m),500)}}
box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>mv(...b.dataset.d.split(',').map(Number)));
window.onkeydown=e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();mv(...d)}}}
function difG(box,L,done){const n=[6,9,12][L],k=[2,3,4][L],P=['🐟','🍎','🌸','🚗','⭐','🐱','🎈','🍩','🦋','🏠','🍄','🐸'];const a=Array.from({length:n},()=>P[rnd(12)]),ix=sh([...Array(n).keys()]).slice(0,k),b=a.slice();ix.forEach(i=>{let e;do e=P[rnd(12)];while(e==a[i]);b[i]=e});let f=0,m=0;
box.innerHTML=`<h2>اكتشف ${k} اختلافات 🔍</h2><div class="row" style="align-items:flex-start"><div class="grid sm3">${a.map(e=>`<div class="it sy">${e}</div>`).join('')}</div><div class="grid sm3">${b.map((e,i)=>`<button class="it sy" data-i="${i}">${e}</button>`).join('')}</div></div>`;
box.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{if(x.classList.contains('on'))return;if(ix.includes(+x.dataset.i)){x.classList.add('on');ok();if(++f==k)setTimeout(()=>done(m),700)}else{m++;no();x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');say(TRY)}})}
const AD=[['🦁','الأسد','غرررر','🌳','الغابة'],['🐮','البقرة','موووو','🏠','المزرعة'],['🐳','الحوت','','🌊','البحر'],['🐪','الجمل','','🏜️','الصحراء'],['🐧','البطريق','','❄️','القطب'],['🐑','الخروف','ماااا','🏠','المزرعة'],['🐘','الفيل','','🌳','الغابة'],['🐠','السمكة','','🌊','البحر']],HB=[['🌳','الغابة'],['🏠','المزرعة'],['🌊','البحر'],['🏜️','الصحراء'],['❄️','القطب']];
function animG(box,L,done){let r=0,m=0;const R=[3,4,4][L],q=sh(AD);(function next(){if(r>=R)return done(m);const a=q[r++],hs=sh([a[3]+'|'+a[4],...sh(HB.filter(h=>h[0]!=a[3])).slice(0,2).map(h=>h[0]+'|'+h[1])]);
box.innerHTML=`<h2>أين يعيش ${a[1]}؟</h2><div class="card" style="font-size:90px;max-width:200px;margin:0 auto 14px;cursor:pointer" id="an">${a[0]}</div><p>${a[2]?'يقول: '+a[2]:'اضغط على الحيوان ليتكلم'}</p><div class="row">${hs.map(h=>{const[e,n]=h.split('|');return`<button class="big" style="background:#6fa8ff;box-shadow:0 7px 0 #3f6fc9" data-h="${e}">${e}<br><small>${n}</small></button>`}).join('')}</div>`;
speak(a[1]+' '+a[2]);setTimeout(()=>ani(a[0]),300);$('#an').onclick=()=>{const e=$('#an');ani(a[0]);speak(a[1]+' '+a[2]);e.classList.remove('a0');void e.offsetWidth;e.classList.add('a0')};
box.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{if(b.dataset.h==a[3]){ok();speak(a[1]+' يعيش في '+a[4]);b.style.background='var(--ok)';setTimeout(next,1600)}else{m++;no();b.style.opacity=.4;say(TRY)}})})()}
const GM=[{n:'صياد الألوان',e:'🎨',run:colorG},{n:'الذاكرة الذكية',e:'🧠',run:memG},{n:'تركيب الصور',e:'🧩',run:puzG},{n:'عدّ واجمع',e:'🔢',run:cntG},{n:'أنقذ صديقك',e:'🐣',run:resG},{n:'أين الاختلاف؟',e:'🔍',run:difG},{n:'عالم الحيوانات',e:'🦁',run:animG}];
const RG=[{n:'جزيرة الألوان',e:'🏝️',g:0,c:'#ff7ab6,#ffb347'},{n:'غابة الحيوانات المرحة',e:'🌳',g:1,c:'#43c878,#9be15d'},{n:'مدينة الأرقام',e:'🏙️',g:3,c:'#4facfe,#00c6ff'},{n:'مملكة الألغاز',e:'🏰',g:2,c:'#a98bff,#ff8fd8'},{n:'عالم الفضاء',e:'🪐',g:5,c:'#5b4bd6,#2a2060'},{n:'جزيرة المغامرات',e:'⛵',g:4,c:'#ff8a1f,#ffd23d'},{n:'حديقة الحيوانات',e:'🦒',g:6,c:'#ffb347,#8bd450'}];
const AGE=['٣–٤ سنوات','٥–٦ سنوات','٧–٩ سنوات'],PR=['أحسنت!','رائع!','أنت بطل!','ممتاز!'];
const bar=(b,t)=>`<div class="bar"><button class="sm" onclick="go('${b}')">➡️</button><b>${t}</b><span class="st">⭐ ${stars()}</span></div>`;
const V={
start:()=>`<div class="c"><div class="emb"><svg viewBox="0 0 120 120" width="96" height="96"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fa5"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient></defs><path d="M60 6L108 24V62Q108 96 60 114Q12 96 12 62V24Z" fill="url(#eg)" stroke="#fff" stroke-width="5"/><polygon points="60,28 70,52 96,55 76,72 82,98 60,85 38,98 44,72 24,55 50,52" fill="#fff7c2" stroke="#c2417a" stroke-width="3" stroke-linejoin="round"/></svg></div><div class="logo"><span>كوكب المرح</span></div><h1 class="ttl">FUN PLANET</h1><h2>مغامرات الأبطال الصغار</h2><div class="by">by KMA</div><div class="row">${[0,1,2,3].map(i=>`<div class="ch" onclick="hi(${i},this)">${hero(i,76)}</div>`).join('')}</div><button class="big" onclick="go(S.ch<0?'pick':'map')">▶ هيا نلعب!</button><div class="row"><button class="sm" onclick="go('pick')">🧸 الشخصيات</button><button class="sm" onclick="go('set')">⚙️ الإعدادات</button><button class="sm" onclick="go('par')">👨‍👩‍👧 ولي الأمر</button></div></div>`,
pick:()=>`${bar('start','اختر بطلك')}<div class="rgs">${CH.map((c,i)=>`<div class="card ch ${S.ch==i?'sel':''}" onclick="S.ch=${i};save();go('pick');hi(${i},this)" style="text-align:center">${hero(i,100)}<h2>${c.n}</h2>${c.t}</div>`).join('')}</div>${S.ch>=0?`<div class="c"><button class="big" onclick="go('map')">هيا بنا ▶</button></div>`:''}`,
map:()=>{const s=stars();return`${bar('start','خريطة العالم')}<div class="row" style="margin-bottom:12px">${hero(S.ch,60,1)}<button class="sm" onclick="go('prog')">📒 ملفي</button><button class="sm" onclick="go('set')">⚙️</button></div><div class="rgs">${RG.map((r,i)=>{const lk=s<RT[i];return`<div class="rg ${lk?'lock':''}" style="background:linear-gradient(135deg,${r.c})" onclick="${lk?`say('يحتاج ⭐ ${RT[i]} لفتح هذه المنطقة')`:`go('play',${r.g})`}"><i>${lk?'🔒':r.e}</i>${r.n}<br><small>${GM[r.g].e} ${GM[r.g].n}</small></div>`}).join('')}</div>`},
play:g=>`${bar('map',GM[g].e+' '+GM[g].n)}<div id="gb" class="gb"></div>`,
win:a=>`<div class="c">${Array.from({length:24},()=>`<span class="cf" style="left:${rnd(95)}%;animation-delay:${Math.random()*1.5}s">${['🎉','⭐','🎈','✨'][rnd(4)]}</span>`).join('')}<div class="a${S.ch}" style="animation-iteration-count:infinite">${hero(S.ch,130,1)}</div><h1>${window._pr}</h1><div style="font-size:54px">${[0,1,2].map(i=>i<a.s?`<span class="sp" style="animation-delay:${.3+i*.35}s">⭐</span>`:'<span style="opacity:.4">☆</span>').join('')}</div>${a.nw?'<div class="card">🎁 فتحت مفاجأة جديدة! شاهدها في ملفي</div>':''}<div class="row"><button class="big" onclick="go('play',${a.g})">🔁 مرة أخرى</button><button class="sm" onclick="go('map')">🗺️ الخريطة</button><button class="sm" onclick="go('prog')">📒 ملفي</button></div></div>`,
prog:()=>{const s=stars(),nb=Object.keys(S.best).length,bd=[['🌟','أول نجمة',s>=1],['🎮','جرّبت 3 ألعاب',nb>=3],['🏅','10 نجوم',s>=10],['🏆','كل الألعاب',nb>=7],['💎','ثلاث نجوم كاملة',Object.values(S.best).includes(3)],['🚀','فتحت كل المناطق',s>=16]];
return`${bar('map','ملف التقدم')}<div class="card" style="text-align:center">${hero(S.ch,90,1)}<h2>${CH[S.ch].n} · ⭐ ${s} / 21</h2><div class="hs">${GM.map((g,i)=>`<div>${g.e}<br>${'⭐'.repeat(S.best[i]||0)||'·'}</div>`).join('')}</div></div><div class="card"><h2>🏅 الشارات</h2><div class="hs">${bd.map(b=>`<div style="${b[2]?'':'filter:grayscale(1);opacity:.4'}"><span style="font-size:36px">${b[0]}</span><br><small>${b[1]}</small></div>`).join('')}</div></div><div class="card"><h2>🎩 الأزياء</h2><div class="row"><button class="sm ${S.hat?'':'sel'}" onclick="S.hat=0;save();go('prog')">بدون</button>${HATS.map((h,i)=>s>=HT[i]?`<button class="sm ${S.hat==i+1?'sel':''}" onclick="S.hat=${i+1};save();go('prog')">${h}</button>`:`<button class="sm" style="opacity:.4" onclick="say('يحتاج ⭐ ${HT[i]}')">🔒 ${HT[i]}⭐</button>`).join('')}</div></div><div class="card"><h2>🏡 بيتي الصغير</h2><div class="hs" style="font-size:40px">${HOUSE.map((h,i)=>s>=HOT[i]?`<div class="a${i%4}">${h}</div>`:`<div style="opacity:.25" onclick="say('يحتاج ⭐ ${HOT[i]}')">❔</div>`).join('')}</div></div>`},
set:()=>`${bar(S.ch<0?'start':'map','الإعدادات')}<div class="card"><h2>🔊 الصوت</h2><div class="row"><button class="big" onclick="S.snd=S.snd?0:1;save();music();go('set');ok()">${S.snd?'🔊 الأصوات مفتوحة':'🔇 الأصوات مغلقة'}</button><button class="sm" onclick="S.mus=S.mus?0:1;save();music();go('set')">${S.mus?'🎵 الموسيقى مفتوحة':'🎵 الموسيقى مغلقة'}</button></div><p style="text-align:center"><input type="range" min="0" max="1" step=".1" value="${S.vol}" oninput="S.vol=+this.value;save();ok()"></p></div><div class="card"><h2>🌐 اللغة</h2><div class="row"><button class="sm sel">العربية</button><button class="sm" style="opacity:.5" disabled>English (قريباً)</button></div></div>`,
par:a=>{if(a&&a.ok)return`${bar('start','منطقة ولي الأمر')}<div class="card"><h2>🎂 عمر الطفل</h2><div class="row">${AGE.map((t,i)=>`<button class="sm ${S.age==i?'sel':''}" onclick="S.age=${i};save();go('par',{ok:1})">${t}</button>`).join('')}</div></div><div class="card"><h2>🔒 الخصوصية</h2><p>اللعبة تعمل دون إنترنت، لا تجمع أي بيانات، لا إعلانات ولا مشتريات ولا روابط خارجية. التقدم محفوظ على هذا الجهاز فقط.</p></div><div class="card"><button class="sm" onclick="rs(this)">🗑️ مسح تقدم الطفل</button></div>`;
const x=3+rnd(7),y=3+rnd(7),o=sh([x+y,x+y+1,x+y-2]);return`${bar('start','للكبار فقط')}<div class="card c"><h2>كم ناتج ${x} + ${y} ؟</h2><div class="row">${o.map(v=>`<button class="big" onclick="${v==x+y?"go('par',{ok:1})":"go('par')"}">${v}</button>`).join('')}</div></div>`}};
function rs(b){if(!window._rs){window._rs=1;b.textContent='اضغط مرة أخرى للتأكيد';return}window._rs=0;S=JSON.parse(JSON.stringify(DEF));save();go('start')}
function fin(g,m){const s=m<=1?3:m<=3?2:1,b=stars();if(s>(S.best[g]||0))S.best[g]=s;save();const a=stars();winS();window._pr=PR[rnd(4)];speak(window._pr);go('win',{g,s,nw:[...HT,...HOT,...RT].some(t=>b<t&&a>=t)})}
const B={play:g=>GM[g].run($('#gb'),S.age,m=>fin(g,m))};
const CP='<p class="cp">© 2026 KMA — جميع الحقوق محفوظة<br><small>كوكب المرح™ by KMA · الشخصيات والتصاميم والأصوات والبرمجة ملك حصري لـ KMA</small></p>';
function go(s,a){window.onkeydown=null;$('#say').style.display='none';$('#app').innerHTML=V[s](a)+(['start','par','set'].includes(s)?CP:'');scrollTo(0,0);B[s]&&B[s](a)}
['☁️','🎈','⭐','🦋','🌈','✨','🌸'].forEach((e,i)=>{const s=document.createElement('span');s.className='fl';s.textContent=e;s.style.cssText=`left:${8+i*13}%;animation-duration:${14+i*3}s;animation-delay:-${i*4}s`;document.body.appendChild(s)});
go('start');
